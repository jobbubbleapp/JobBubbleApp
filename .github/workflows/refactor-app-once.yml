name: Apply Android refactor cleanup

on:
  push:
    branches:
      - refactor/app-cleanup
    paths:
      - '.github/workflows/refactor-app-once.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Fold dead-method removal into current patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('scripts/v947_patch.py')
          s = p.read_text(encoding='utf-8')
          marker = '# Refactor cleanup: remove private methods proven to have no callers.'
          if marker in s:
              raise SystemExit('Refactor cleanup already present')
          cleanup = r'''

# Refactor cleanup: remove private methods proven to have no callers.
def _remove_private_java_method(text, name):
    import re as _re
    pattern = _re.compile(
        r'(?m)^[ \t]*private\s+(?:static\s+)?(?:final\s+)?[\w<>\[\].?, ]+\s+' +
        _re.escape(name) + r'\s*\([^;{]*\)\s*\{'
    )
    match = pattern.search(text)
    if not match:
        raise SystemExit(f'Dead-method cleanup target not found: {name}')
    start = match.start()
    brace = text.find('{', match.start(), match.end())
    if brace < 0:
        raise SystemExit(f'Opening brace not found for: {name}')

    depth = 0
    state = 'code'
    escaped = False
    i = brace
    end = None
    while i < len(text):
        ch = text[i]
        nxt = text[i + 1] if i + 1 < len(text) else ''
        if state == 'code':
            if ch == '/' and nxt == '/':
                state = 'line'; i += 2; continue
            if ch == '/' and nxt == '*':
                state = 'block'; i += 2; continue
            if ch == '"':
                state = 'string'; escaped = False; i += 1; continue
            if ch == "'":
                state = 'char'; escaped = False; i += 1; continue
            if ch == '{':
                depth += 1
            elif ch == '}':
                depth -= 1
                if depth == 0:
                    end = i + 1
                    break
        elif state == 'line':
            if ch == '\n': state = 'code'
        elif state == 'block':
            if ch == '*' and nxt == '/':
                state = 'code'; i += 2; continue
        elif state in ('string', 'char'):
            if escaped:
                escaped = False
            elif ch == '\\':
                escaped = True
            elif (state == 'string' and ch == '"') or (state == 'char' and ch == "'"):
                state = 'code'
        i += 1

    if end is None:
        raise SystemExit(f'Closing brace not found for: {name}')
    while end < len(text) and text[end] in ' \t': end += 1
    if end < len(text) and text[end] == '\r': end += 1
    if end < len(text) and text[end] == '\n': end += 1
    if end < len(text) and text[end] == '\n': end += 1
    return text[:start] + text[end:]

_dead_methods = [
    'addForeignCountryLabel',
    'bboxIntersects',
    'bestAddressText',
    'chooseCompanyLocation',
    'correctJobCoordinates',
    'followJob',
    'installForeignCountryCurtains',
    'isGenericCompanyName',
    'ovalStrokeBg',
    'renderExpandedPile',
    'shortCompanyName',
    'tileYToLatitude',
    'violetGlassBg',
]
_refactored = java.read_text(encoding='utf-8')
for _method in _dead_methods:
    _refactored = _remove_private_java_method(_refactored, _method)
java.write_text(_refactored, encoding='utf-8')
print(f'Removed {len(_dead_methods)} dead MainActivity methods')
'''
          p.write_text(s.rstrip() + cleanup + '\n', encoding='utf-8')

          for workflow in [
              Path('.github/workflows/build-android.yml'),
              Path('.github/workflows/validate-v947-app.yml'),
              Path('.github/workflows/export-source.yml'),
          ]:
              if not workflow.exists():
                  continue
              text = workflow.read_text(encoding='utf-8')
              text = text.replace('actions/checkout@v4', 'actions/checkout@v5')
              text = text.replace('actions/setup-java@v4', 'actions/setup-java@v5')
              workflow.write_text(text, encoding='utf-8')
          PY

          rm -f scripts/v942_patch.py
          rm -f .github/workflows/inspect-job-display.yml
          rm -f JobBubble-V9.4.40-USA-ONLY-MAPS-debug.apk
      - name: Reconstruct, audit, and compile cleaned app
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'JobBubble-*.zip' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)
          rm -rf "$RUNNER_TEMP/jobbubble-refactor"
          mkdir -p "$RUNNER_TEMP/jobbubble-refactor"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/jobbubble-refactor"
          GRADLEW=$(find "$RUNNER_TEMP/jobbubble-refactor" -type f -name gradlew -print -quit)
          PROJECT_DIR=$(dirname "$GRADLEW")
          python3 scripts/v943_patch.py "$PROJECT_DIR"
          python3 scripts/v944_patch.py "$PROJECT_DIR"
          python3 scripts/v947_patch.py "$PROJECT_DIR"
          MAIN="$PROJECT_DIR/app/src/main/java/com/jobbubble/app/MainActivity.java"
          python3 - "$MAIN" <<'PY'
          import re, sys
          from pathlib import Path
          text = Path(sys.argv[1]).read_text(encoding='utf-8')
          pattern = re.compile(r'(?m)^\s*private\s+(?:static\s+)?(?:final\s+)?[\w<>\[\].?, ]+\s+(\w+)\s*\([^;{]*\)\s*\{')
          names = pattern.findall(text)
          dead = []
          for name in sorted(set(names)):
              count = len(re.findall(r'\b' + re.escape(name) + r'\b', text))
              if count == 1:
                  dead.append(name)
          print('POST_REFACTOR_SOURCE_LINES', len(text.splitlines()))
          print('POST_REFACTOR_METHOD_COUNT', len(set(names)))
          print('POST_REFACTOR_POTENTIAL_DEAD', ','.join(dead) if dead else 'none')
          if dead:
              raise SystemExit('Potential dead private methods remain: ' + ', '.join(dead))
          PY
          chmod +x "$PROJECT_DIR/gradlew"
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug
      - name: Commit refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/refactor-audit.yml .github/workflows/refactor-app-once.yml
          git add -A
          git commit -m "Refactor Android build and remove dead app code"
          git push
