name: Inspect generated JobBubble app

on:
  push:
    branches:
      - feature/help-bug-report
    paths:
      - '.github/workflows/inspect-generated-app.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract current project and apply patches
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'JobBubble-*.zip' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)
          rm -rf "$RUNNER_TEMP/jobbubble-project"
          mkdir -p "$RUNNER_TEMP/jobbubble-project"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/jobbubble-project"
          GRADLEW=$(find "$RUNNER_TEMP/jobbubble-project" -type f -name gradlew -print -quit)
          PROJECT_DIR=$(dirname "$GRADLEW")
          python3 scripts/v943_patch.py "$PROJECT_DIR"
          python3 scripts/v944_patch.py "$PROJECT_DIR"
          mkdir -p _inspect
          cp "$PROJECT_DIR/app/src/main/java/com/jobbubble/app/MainActivity.java" _inspect/MainActivity.java
          cp "$PROJECT_DIR/app/src/main/AndroidManifest.xml" _inspect/AndroidManifest.xml
          cp "$PROJECT_DIR/app/build.gradle" _inspect/app-build.gradle 2>/dev/null || true
          cp "$PROJECT_DIR/app/build.gradle.kts" _inspect/app-build.gradle.kts 2>/dev/null || true
      - name: Commit inspection files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _inspect
          git commit -m "Inspect generated Android source [skip ci]"
          git push
