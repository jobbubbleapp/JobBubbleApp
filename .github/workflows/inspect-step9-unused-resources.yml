name: Inspect Step 9 Unused Resources

on:
  push:
    branches: [feature/step9-cleanup-testing]
    paths:
      - '.github/workflows/inspect-step9-unused-resources.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Materialize and inspect lint-reported unused resources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jb"; unzip -q JobBubble-V9.4.41-RESET-BUTTON.zip -d "$RUNNER_TEMP/jb"
          G=$(find "$RUNNER_TEMP/jb" -type f -name gradlew -print -quit); P=$(dirname "$G")
          python3 scripts/apply_current.py "$P" >/tmp/unused-pipeline.txt
          cd "$P"
          : > /tmp/unused-references.txt
          for name in chip_bg dropdown_bg google_map_light_style ic_filter ic_launcher_foreground ic_logo_pin ic_search outline_button panel welcome_bubble_blue welcome_bubble_green welcome_bubble_purple; do
            echo "### $name" | tee -a /tmp/unused-references.txt
            grep -RIn --exclude-dir=build --exclude="${name}.xml" --exclude="${name}.json" -E "(@(?:drawable|raw)/${name}|R\.(?:drawable|raw)\.${name}|getIdentifier\([^)]*${name}|\b${name}\b)" app/src || true
          done | tee -a /tmp/unused-references.txt
      - uses: actions/upload-artifact@v4
        with:
          name: step9-unused-resource-inventory
          path: /tmp/unused-references.txt
          retention-days: 3
