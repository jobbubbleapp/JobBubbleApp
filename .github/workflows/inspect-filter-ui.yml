name: Inspect JobBubble Filter UI

on:
  push:
    branches:
      - feature/code-cleanup-v948
    paths:
      - '.github/workflows/inspect-filter-ui.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and patch current project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'JobBubble-*.zip' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)
          rm -rf "$RUNNER_TEMP/jb"; mkdir -p "$RUNNER_TEMP/jb"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/jb"
          GRADLEW=$(find "$RUNNER_TEMP/jb" -type f -name gradlew -print -quit)
          P=$(dirname "$GRADLEW")
          python3 scripts/apply_current.py "$P"
          MAIN="$P/app/src/main/java/com/jobbubble/app/MainActivity.java"
          echo '===== filter setup ====='
          sed -n '1138,1170p' "$MAIN"
          echo '===== choice menu ====='
          sed -n '1450,1510p' "$MAIN"
          echo '===== numeric filter ====='
          sed -n '1540,1580p' "$MAIN"
          echo '===== filter settings ====='
          sed -n '1590,1630p' "$MAIN"
          echo '===== loading + loadJobs ====='
          sed -n '1615,1750p' "$MAIN"
