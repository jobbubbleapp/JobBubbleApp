name: Diagnose Live Muse Final
on:
  push:
    branches: [ feature/code-cleanup-v948 ]
    paths: [ '.github/workflows/diagnose-live-muse-final.yml' ]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Compare named and coordinate searches
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.parse
          base='https://jobbubble-backend-1.onrender.com/jobs'
          tests=[('named','Everett, WA'),('coordinate','47.97800,-122.20210')]
          for label,where in tests:
              q=urllib.parse.urlencode({'where':where,'lat':'47.9780','lon':'-122.2021','radius':'100','source':'themuse'})
              u=base+'?'+q
              with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'JobBubble-final-diagnostic'}),timeout=90) as r: d=json.load(r)
              jobs=d.get('jobs') or []
              print(label,'COUNT=',len(jobs),'SEARCH_LOCATION=',d.get('search_location'),'SOURCE=',d.get('source_filter'),'REFINING=',d.get('location_refining'))
              for i,j in enumerate(jobs[:5]):
                  print(label,i,json.dumps({k:j.get(k) for k in ['title','source','latitude','longitude','location']},ensure_ascii=False))
          PY
