name: Verify V9.4.81 UI color and Google sign-in

on:
  push:
    branches:
      - fix/ui-color-google-signin-v981
    paths:
      - 'scripts/**'
      - '.github/workflows/verify-v981-ui-color-signin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Materialize V9.4.81
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'JobBubble-*.zip' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)
          test -n "$ZIP_FILE"
          rm -rf "$RUNNER_TEMP/jobbubble-project"
          mkdir -p "$RUNNER_TEMP/jobbubble-project"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/jobbubble-project"
          GRADLEW=$(find "$RUNNER_TEMP/jobbubble-project" -type f -name gradlew -print -quit)
          test -n "$GRADLEW"
          P=$(dirname "$GRADLEW")
          python3 scripts/apply_current.py "$P"
          echo "project_dir=$P" >> "$GITHUB_OUTPUT"

      - name: Verify colors only and Google sign-in invariants
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,re

          p=Path(os.environ['PROJECT_DIR'])
          main=(p/'app/src/main/java/com/jobbubble/app/MainActivity.java').read_text(encoding='utf-8')
          build=(p/'app/build.gradle').read_text(encoding='utf-8')
          version=(p/'VERSION.txt').read_text(encoding='utf-8').strip()
          google=(p/'app/src/main/res/drawable/welcome_google_button.xml').read_text(encoding='utf-8')
          auth=(p/'app/src/main/res/layout/activity_auth.xml').read_text(encoding='utf-8')
          welcome=(p/'app/src/main/res/layout/activity_welcome.xml').read_text(encoding='utf-8')

          assert version == '9.4.81', version
          assert re.search(r'versionCode\s+88\b',build)
          assert "versionName '9.4.81'" in build
          assert re.search(r'targetSdk(?:Version)?\s+35\b',build)

          def method(signature):
              start=main.index(signature)
              tail=main[start+len(signature):]
              m=re.search(r'\n\s{4}private\s+',tail)
              end=start+len(signature)+m.start() if m else len(main)
              return main[start:end]

          choice=method('    private void showChoiceMenu(')
          for color in ('#0B1A29','#0E2132','#10283A','#31546C','#2196F3','#F4F8FC','#8FA7BA'):
              assert color in choice, f'missing choice-menu blue color {color}'
          for old in ('#0C051F','#100921','#24103D','#2B1B45','#7336B5','#B56DFF','#6E2FA4','#1B0D31','#663399','#1A0D2C','#4B2A70','#B7A8DD','#E9DFFF','#160B28','#6B3BA0','#5A169A','#7A1CC7'):
              assert old not in choice, f'old purple choice color remains: {old}'

          row=method('    private void addModernJobRow(')
          shell=method('    private LinearLayout modernListShell(')
          joblist=method('    private void showJobList(')
          searchrows=method('    private void rebuildSearchRows(')
          search=method('    private void showSearchDialog(')
          combined=row+shell+joblist+searchrows+search
          for color in ('#0B1A29','#0E2132','#10283A','#31546C','#2196F3','#F4F8FC','#8FA7BA','#6F879A','#526A7E'):
              assert color in combined, f'missing search/list blue color {color}'
          for old in ('#110B25','#3B275B','#A99CC9','#B98CFF','#0B0717','#3F2463','#73519C','#F8F6FF','#17102C','#6E3DA8','#80739A','#F5F2FB','#100A20','#55327B','#CCB4F5','#6D3FC3'):
              assert old not in combined, f'old purple search/list color remains: {old}'

          assert '<solid android:color="#10283A" />' in google
          assert '<stroke android:width="1dp" android:color="#2196F3" />' in google
          assert 'android:id="@+id/googleButton"' in auth
          assert 'android:id="@+id/googleWelcomeButton"' in welcome
          assert '@drawable/welcome_google_button' in auth
          assert '@drawable/welcome_google_button' in welcome
          for required in ('googleWelcomeButton','googleButton','googleSignInClient.getSignInIntent()','firebaseAuthWithGoogle(account)'):
              assert required in main, f'missing Google sign-in behavior: {required}'

          print('V9.4.81 palette, release metadata, and Google sign-in invariants verified')
          PY

      - name: Inject Maps key
        shell: bash
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          test -n "${GOOGLE_MAPS_API_KEY:-}"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          from xml.sax.saxutils import escape
          project=Path(os.environ['PROJECT_DIR'])
          key=escape(os.environ['GOOGLE_MAPS_API_KEY'],{'"':'&quot;'})
          changed=0
          for manifest in project.rglob('src/main/AndroidManifest.xml'):
              text=manifest.read_text(encoding='utf-8')
              if 'com.google.android.geo.API_KEY' not in text:
                  continue
              pat=re.compile(r'(<meta-data\s+[^>]*android:name=["\']com\.google\.android\.geo\.API_KEY["\'][^>]*android:value=["\'])[^"\']*(["\'][^>]*/?>)',re.DOTALL)
              text,n=pat.subn(r'\1'+key+r'\2',text,count=1)
              if n:
                  manifest.write_text(text,encoding='utf-8')
                  changed += n
          if changed == 0:
              raise SystemExit('Maps API key metadata not found')
          PY

      - name: Unit tests lint and APK build
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug --stacktrace
          REPORT=$(find app/build/reports -type f -name 'lint-results-debug.txt' -print -quit || true)
          if [ -n "$REPORT" ] && grep -q 'Error:' "$REPORT"; then
            cat "$REPORT"
            exit 1
          fi

      - name: Collect APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          A=$(find "${{ steps.project.outputs.project_dir }}" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)
          test -n "$A"
          mkdir -p "$RUNNER_TEMP/apks"
          cp "$A" "$RUNNER_TEMP/apks/JobBubble-V9.4.81-debug.apk"
          echo "path=$RUNNER_TEMP/apks/JobBubble-V9.4.81-debug.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: JobBubble-V9.4.81-debug
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
