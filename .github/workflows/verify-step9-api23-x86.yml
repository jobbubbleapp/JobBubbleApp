name: Verify Step 9 API 23 x86

on:
  push:
    branches: [verify/step9-api23-x86]
    paths:
      - 'scripts/step9_runtime_smoke.sh'
      - '.github/workflows/verify-step9-api23-x86.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Free runner storage and enable KVM
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"/CodeQL || true
          docker system prune -af || true
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Materialize and build exact V9.4.80 source
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/step9_runtime_smoke.sh
          rm -rf "$RUNNER_TEMP/jb"; mkdir -p "$RUNNER_TEMP/jb"
          unzip -q JobBubble-V9.4.41-RESET-BUTTON.zip -d "$RUNNER_TEMP/jb"
          G=$(find "$RUNNER_TEMP/jb" -type f -name gradlew -print -quit); test -n "$G"; P=$(dirname "$G")
          python3 scripts/apply_current.py "$P"
          test "$(tr -d '\r\n ' < "$P/VERSION.txt")" = '9.4.80'
          grep -Fq 'firebase-auth:23.2.1' "$P/app/build.gradle"
          grep -Fq 'firebase-firestore:26.6.0' "$P/app/build.gradle"
          test -n "${GOOGLE_MAPS_API_KEY:-}"
          PROJECT_DIR="$P" python3 - <<'PY'
          import os,re
          from pathlib import Path
          from xml.sax.saxutils import escape
          p=Path(os.environ['PROJECT_DIR']); key=escape(os.environ['GOOGLE_MAPS_API_KEY'],{'"':'&quot;'})
          found=0
          for m in p.rglob('src/main/AndroidManifest.xml'):
              t=m.read_text()
              if 'com.google.android.geo.API_KEY' in t:
                  pat=re.compile(r'(<meta-data\s+[^>]*android:name=["\']com\.google\.android\.geo\.API_KEY["\'][^>]*android:value=["\'])[^"\']*(["\'][^>]*/?>)',re.S)
                  t,n=pat.subn(r'\1'+key+r'\2',t,count=1)
                  if n: found+=1; m.write_text(t)
          assert found
          PY
          cd "$P"
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 testDebugUnitTest assembleDebug
          mkdir -p "$RUNNER_TEMP/apk"
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -print -quit); test -n "$APK"
          cp "$APK" "$RUNNER_TEMP/apk/JobBubble-v9.4.80-debug.apk"
      - name: Run API 23 x86 JobBubble smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        env:
          STEP9_API: 23
        with:
          api-level: 23
          arch: x86
          target: google_apis
          profile: pixel_4
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 4096M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/step9_runtime_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step9-v980-api23-x86-evidence
          path: |
            ${{ runner.temp }}/api23-final.png
            ${{ runner.temp }}/api23-logcat.txt
            ${{ runner.temp }}/api23-activity.txt
            ${{ runner.temp }}/api23-final.xml
            ${{ runner.temp }}/api23-last.xml
          if-no-files-found: ignore
          retention-days: 3
