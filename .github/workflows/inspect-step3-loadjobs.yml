name: Inspect JobBubble Step 3 Filter Interactions

on:
  push:
    branches:
      - feature/code-cleanup-v948
    paths:
      - '.github/workflows/inspect-step3-loadjobs.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current generated pay lifecycle
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'JobBubble-*.zip' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)
          rm -rf "$RUNNER_TEMP/jb"; mkdir -p "$RUNNER_TEMP/jb"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/jb"
          GRADLEW=$(find "$RUNNER_TEMP/jb" -type f -name gradlew -print -quit)
          P=$(dirname "$GRADLEW")
          python3 scripts/apply_current.py "$P"
          MAIN="$P/app/src/main/java/com/jobbubble/app/MainActivity.java"
          OUT="$RUNNER_TEMP/step3-pay-diagnostic.txt"

          {
            echo '===== buildJobRequestUrl ====='
            grep -n -A120 -B15 'String buildJobRequestUrl' "$MAIN" || true
            echo '===== min pay declarations/usages ====='
            grep -n -E -A18 -B12 'minPay|minimumPay|payMin|payFilter|payFloor' "$MAIN" || true
            echo '===== pay/salary parse/filter snippets ====='
            grep -n -E -A28 -B16 'salary|hourly|parse.*[Pp]ay|extract.*[Pp]ay|matches.*[Pp]ay|[Pp]ay.*match' "$MAIN" || true
            echo '===== refresh ====='
            grep -n -A50 -B15 'void refreshForRangeChange' "$MAIN" || true
            echo '===== version ====='
            grep -n -E 'versionName|VERSION|V9\.4\.' "$P/app/build.gradle" "$P/app/build.gradle.kts" "$MAIN" 2>/dev/null || true
          } > "$OUT"
          cat "$OUT"

      - name: Upload targeted Step 3 diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: step3-pay-diagnostic
          path: ${{ runner.temp }}/step3-pay-diagnostic.txt
          retention-days: 1
