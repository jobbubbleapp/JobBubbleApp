name: Inspect JobBubble Step 3 Filter Interactions

on:
  push:
    branches:
      - feature/code-cleanup-v948
    paths:
      - '.github/workflows/inspect-step3-loadjobs.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current generated filter lifecycle
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'JobBubble-*.zip' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)
          rm -rf "$RUNNER_TEMP/jb"; mkdir -p "$RUNNER_TEMP/jb"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/jb"
          GRADLEW=$(find "$RUNNER_TEMP/jb" -type f -name gradlew -print -quit)
          P=$(dirname "$GRADLEW")
          python3 scripts/apply_current.py "$P"
          MAIN="$P/app/src/main/java/com/jobbubble/app/MainActivity.java"

          echo '===== filter and refresh methods ====='
          grep -n -E -A120 -B20 'void applyFilters\(|void refreshForRangeChange\(|String backendCategoryQuery\(|String backendSourceParam\(|String buildJobRequestUrl\(' "$MAIN" | head -1800 || true

          echo '===== filter controls/callbacks ====='
          grep -n -E -A50 -B20 'activeCategory|maxDistanceMiles|minPay|selectedSource|show.*Filter|show.*Sheet|onStopTrackingTouch|All jobs|All sources' "$MAIN" | head -2200 || true

          echo '===== pay parsing/matching ====='
          grep -n -E -A35 -B20 'pay|salary|hourly|minPay|maxPay|extract.*Pay|parse.*Pay|matches.*Pay' "$MAIN" | head -1800 || true

          echo '===== cache/refined result paths ====='
          grep -n -E -A45 -B20 'jobsCache|persistJobsCache|load.*Cache|requestRefinedJobs|refinement_pending|jobs\.clear|jobs\.addAll' "$MAIN" | head -1800 || true
