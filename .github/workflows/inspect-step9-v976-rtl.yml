name: Inspect Step 9 V9.4.76 RTL

on:
  push:
    branches: [feature/step9-cleanup-testing]
    paths:
      - '.github/workflows/inspect-step9-v976-rtl.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Materialize and find remaining directional attributes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jb"; unzip -q JobBubble-V9.4.41-RESET-BUTTON.zip -d "$RUNNER_TEMP/jb"
          G=$(find "$RUNNER_TEMP/jb" -type f -name gradlew -print -quit); P=$(dirname "$G")
          python3 scripts/apply_current.py "$P" >/dev/null
          echo '--- layout directional tokens ---'
          grep -RInE 'layout_(margin)?(Left|Right)|padding(Left|Right)|drawable(Left|Right)|gravity="[^\"]*(left|right)|textAlignment="(viewStart|viewEnd|textStart|textEnd|center|inherit|gravity|viewStart|viewEnd)|layout_align(Parent)?(Left|Right)|layout_to(Left|Right)Of' "$P/app/src/main/res" || true
          echo '--- Java directional gravity/tokens ---'
          grep -nE 'Gravity\.(LEFT|RIGHT)|setPadding\(|setMargins\(' "$P/app/src/main/java/com/jobbubble/app/MainActivity.java" | head -n 120 || true
