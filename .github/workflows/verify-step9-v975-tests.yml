name: Verify Step 9 V9.4.75 Tests

on:
  push:
    branches: [feature/step9-cleanup-testing]
    paths:
      - 'scripts/v975_unit_testable_job_logic.py'
      - 'scripts/apply_current.py'
      - '.github/workflows/verify-step9-v975-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Materialize V9.4.75
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jb"
          unzip -q JobBubble-V9.4.41-RESET-BUTTON.zip -d "$RUNNER_TEMP/jb"
          G=$(find "$RUNNER_TEMP/jb" -type f -name gradlew -print -quit); test -n "$G"
          P=$(dirname "$G"); python3 scripts/apply_current.py "$P"
          echo "P=$P" >> "$GITHUB_ENV"
          test "$(tr -d '\r\n ' < "$P/VERSION.txt")" = '9.4.75'
          grep -Eq '^\s*targetSdk\s+35\s*$' "$P/app/build.gradle"
          grep -Eq '^\s*versionCode\s+82\s*$' "$P/app/build.gradle"
          grep -Eq "^\s*versionName\s+['\"]9\.4\.75['\"]\s*$" "$P/app/build.gradle"
          test -f "$P/app/src/main/java/com/jobbubble/app/JobLogic.java"
          test -f "$P/app/src/test/java/com/jobbubble/app/JobLogicTest.java"
      - name: Run real Android unit tests and build
        shell: bash
        working-directory: ${{ env.P }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 testDebugUnitTest assembleDebug | tee /tmp/v975-gradle.txt
          XML=$(find app/build/test-results/testDebugUnitTest -name '*.xml' -print -quit)
          test -n "$XML"
          python3 - <<'PY'
          import glob,xml.etree.ElementTree as ET
          files=glob.glob('app/build/test-results/testDebugUnitTest/*.xml')
          tests=failures=errors=0
          for f in files:
              r=ET.parse(f).getroot(); tests+=int(r.attrib.get('tests',0)); failures+=int(r.attrib.get('failures',0)); errors+=int(r.attrib.get('errors',0))
          assert tests>=4,(tests,failures,errors)
          assert failures==0 and errors==0,(tests,failures,errors)
          print(f'PASS: {tests} Android unit tests, 0 failures, 0 errors')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: step9-v975-unit-test-evidence
          path: |
            /tmp/v975-gradle.txt
            ${{ env.P }}/app/build/test-results/testDebugUnitTest/
          retention-days: 3
