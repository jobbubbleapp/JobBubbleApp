name: Step 8 Final V9.4.73 Runtime Matrix

on:
  push:
    branches: [feature/code-cleanup-v948]
    paths: ['.github/workflows/step8-final-runtime.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.materialize.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Materialize and build
        id: materialize
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dorg.gradle.vfs.watch=false
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jb"; unzip -q JobBubble-V9.4.41-RESET-BUTTON.zip -d "$RUNNER_TEMP/jb"
          G=$(find "$RUNNER_TEMP/jb" -type f -name gradlew -print -quit); P=$(dirname "$G")
          python3 scripts/apply_current.py "$P"
          V=$(tr -d '\r\n ' < "$P/VERSION.txt"); test "$V" = '9.4.73'; echo "version=$V" >> "$GITHUB_OUTPUT"
          python3 - "$P" <<'PY'
          import os,re,sys,pathlib
          from xml.sax.saxutils import escape
          root=pathlib.Path(sys.argv[1]); key=escape(os.environ['GOOGLE_MAPS_API_KEY'],{'"':'&quot;'})
          n=0
          for p in root.rglob('src/main/AndroidManifest.xml'):
              s=p.read_text()
              if 'com.google.android.geo.API_KEY' not in s: continue
              pat=re.compile(r'(<meta-data\s+[^>]*android:name=["\']com\.google\.android\.geo\.API_KEY["\'][^>]*android:value=["\'])[^"\']*(["\'][^>]*/?>)',re.S)
              s,c=pat.subn(r'\1'+key+r'\2',s,count=1)
              if c: p.write_text(s); n+=1
          assert n==1
          PY
          chmod +x "$P/gradlew"; (cd "$P" && ./gradlew --no-daemon --max-workers=2 assembleDebug)
          A=$(find "$P" -path '*/build/outputs/apk/debug/*.apk' -type f -print -quit); test -s "$A"; cp "$A" JobBubble-V9.4.73-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: step8-v973-apk
          path: JobBubble-V9.4.73-debug.apk
          retention-days: 3

  api35:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: step8-v973-apk
          path: ${{ runner.temp }}/apk
      - name: Free storage and enable KVM
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"/CodeQL || true; sudo apt-get clean || true; docker system prune -af || true
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Prepare API 35 verifier
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/api35.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          APK="$RUNNER_TEMP/apk/JobBubble-V9.4.73-debug.apk"
          dump(){ adb shell uiautomator dump --compressed "/sdcard/$1.xml" >/dev/null || true; adb pull "/sdcard/$1.xml" "$RUNNER_TEMP/$1.xml" >/dev/null || true; }
          tap(){ python3 - "$1" "$2" <<'PY'
          import html,re,subprocess,sys
          needle,path=sys.argv[1:]; s=open(path,encoding='utf-8').read()
          for n in re.findall(r'<node[^>]*>',s):
              t=re.search(r'text="([^"]*)"',n); b=re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"',n)
              if t and b and needle.casefold() in html.unescape(t.group(1)).casefold():
                  subprocess.run(['adb','shell','input','tap',str((int(b[1])+int(b[3]))//2),str((int(b[2])+int(b[4]))//2)],check=True); raise SystemExit(0)
          raise SystemExit(1)
          PY
          }
          adb wait-for-device; adb shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done'; adb emu geo fix -122.4194 37.7749 || true
          adb install -r -g "$APK"
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n'|sort -V|tail -n1); AAPT="$ANDROID_HOME/build-tools/$BT/aapt"
          ACT=$("$AAPT" dump badging "$APK"|sed -n "s/launchable-activity: name='\([^']*\)'.*/\1/p"); test -n "$ACT"
          adb logcat -c; adb shell am start -W -n "com.jobbubble.app/$ACT" | tee "$RUNNER_TEMP/api35-start.txt"; sleep 3
          for i in $(seq 1 24); do
            dump api35-entry; f="$RUNNER_TEMP/api35-entry.xml"
            if grep -q 'Got it' "$f"; then tap 'Got it' "$f" || true; sleep 1; continue; fi
            if grep -q 'text="List"' "$f"; then break; fi
            if grep -qi 'Continue as Guest' "$f"; then tap 'Continue as Guest' "$f" || true; sleep 3; continue; fi
            if grep -qi 'Guest' "$f"; then tap 'Guest' "$f" || true; sleep 3; continue; fi
            sleep 2
          done
          for i in $(seq 1 60); do
            dump api35-ready
            if grep -q 'package="com.jobbubble.app"' "$RUNNER_TEMP/api35-ready.xml" && grep -q 'text="List"' "$RUNNER_TEMP/api35-ready.xml" && ! grep -q 'Loading your jobs list' "$RUNNER_TEMP/api35-ready.xml"; then break; fi
            sleep 2
          done
          grep -q 'text="List"' "$RUNNER_TEMP/api35-ready.xml"
          for i in 1 2 3; do adb shell input tap 540 1100; adb shell input tap 540 1100; sleep 2; done
          dump api35-zoom; grep -q 'package="com.jobbubble.app"' "$RUNNER_TEMP/api35-zoom.xml"
          if grep -q 'text="List"' "$RUNNER_TEMP/api35-zoom.xml"; then tap 'List' "$RUNNER_TEMP/api35-zoom.xml" || true; sleep 2; dump api35-list; fi
          adb logcat -d -v threadtime > "$RUNNER_TEMP/api35-logcat.txt"
          ! grep -E 'FATAL EXCEPTION|ANR in com\.jobbubble\.app' "$RUNNER_TEMP/api35-logcat.txt"
          adb exec-out screencap -p > "$RUNNER_TEMP/api35.png"
          echo 'PASS: API 35 guest/job/map/list runtime smoke passed'
          SH
          chmod +x "$RUNNER_TEMP/api35.sh"
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_4
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash "$RUNNER_TEMP/api35.sh"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step8-v973-api35-runtime
          path: |
            ${{ runner.temp }}/api35-start.txt
            ${{ runner.temp }}/api35-ready.xml
            ${{ runner.temp }}/api35-zoom.xml
            ${{ runner.temp }}/api35-list.xml
            ${{ runner.temp }}/api35-logcat.txt
            ${{ runner.temp }}/api35.png
          if-no-files-found: ignore
          retention-days: 3

  api23:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: step8-v973-apk
          path: ${{ runner.temp }}/apk
      - name: Enable KVM
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Prepare API 23 compatibility verifier
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/api23.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          APK="$RUNNER_TEMP/apk/JobBubble-V9.4.73-debug.apk"
          adb wait-for-device; adb shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done'
          adb install -r "$APK"
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n'|sort -V|tail -n1); AAPT="$ANDROID_HOME/build-tools/$BT/aapt"
          ACT=$("$AAPT" dump badging "$APK"|sed -n "s/launchable-activity: name='\([^']*\)'.*/\1/p"); test -n "$ACT"
          adb logcat -c
          adb shell am start -W -n "com.jobbubble.app/$ACT" | tee "$RUNNER_TEMP/api23-start.txt"
          sleep 8
          adb shell pidof com.jobbubble.app > "$RUNNER_TEMP/api23-pid.txt" || true
          test -s "$RUNNER_TEMP/api23-pid.txt"
          adb logcat -d -v threadtime > "$RUNNER_TEMP/api23-logcat.txt"
          ! grep -E 'FATAL EXCEPTION|ANR in com\.jobbubble\.app|Resources\$NotFoundException' "$RUNNER_TEMP/api23-logcat.txt"
          adb exec-out screencap -p > "$RUNNER_TEMP/api23.png"
          echo 'PASS: minSdk API 23 installed and launched without resource/fatal errors'
          SH
          chmod +x "$RUNNER_TEMP/api23.sh"
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 23
          arch: x86
          target: google_apis
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disk-size: 3072M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash "$RUNNER_TEMP/api23.sh"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step8-v973-api23-runtime
          path: |
            ${{ runner.temp }}/api23-start.txt
            ${{ runner.temp }}/api23-pid.txt
            ${{ runner.temp }}/api23-logcat.txt
            ${{ runner.temp }}/api23.png
          if-no-files-found: ignore
          retention-days: 3
