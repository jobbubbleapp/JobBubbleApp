name: Verify Step 9 V9.4.77 Cleanup

on:
  push:
    branches: [feature/step9-cleanup-testing]
    paths:
      - 'scripts/v976_accessibility_i18n.py'
      - 'scripts/v977_remove_unused_resources.py'
      - 'scripts/apply_current.py'
      - '.github/workflows/verify-step9-v977-unused.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Materialize current V9.4.77 cleanup state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jb"; unzip -q JobBubble-V9.4.41-RESET-BUTTON.zip -d "$RUNNER_TEMP/jb"
          G=$(find "$RUNNER_TEMP/jb" -type f -name gradlew -print -quit); test -n "$G"; P=$(dirname "$G")
          python3 scripts/apply_current.py "$P" | tee /tmp/v977-pipeline.txt
          echo "P=$P" >> "$GITHUB_ENV"
          test "$(tr -d '\r\n ' < "$P/VERSION.txt")" = '9.4.77'
          grep -Eq '^\s*targetSdk\s+35\s*$' "$P/app/build.gradle"
          grep -Eq '^\s*versionCode\s+84\s*$' "$P/app/build.gradle"
      - name: Unit tests lint and build after accessibility and resource cleanup
        shell: bash
        working-directory: ${{ env.P }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 testDebugUnitTest lintDebug assembleDebug | tee /tmp/v977-gradle.txt
          R=$(find app/build -name lint-results-debug.txt -print -quit); cp "$R" /tmp/v977-lint.txt
          python3 - <<'PY'
          import collections,re,glob,xml.etree.ElementTree as ET
          lines=open('/tmp/v977-lint.txt',encoding='utf-8').read().splitlines(); c=collections.Counter()
          for line in lines:
              m=re.search(r'\[([^\]]+)\]\s*$',line)
              if m:c[m.group(1)]+=1
          for cleared in ('UnusedResources','HardcodedText','ContentDescription','RtlHardcoded','RtlSymmetry'):
              assert c[cleared]==0,(cleared,c)
          tests=failures=errors=0
          for f in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              r=ET.parse(f).getroot(); tests+=int(r.attrib.get('tests',0)); failures+=int(r.attrib.get('failures',0)); errors+=int(r.attrib.get('errors',0))
          assert tests>=4 and failures==0 and errors==0,(tests,failures,errors)
          print(f'PASS: accessibility/i18n and unused-resource groups cleared; {tests} unit tests pass')
          print('Remaining warning groups:',dict(c))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: step9-v977-cleanup-evidence
          path: |
            /tmp/v977-pipeline.txt
            /tmp/v977-gradle.txt
            /tmp/v977-lint.txt
          retention-days: 3
