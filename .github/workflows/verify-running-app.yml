name: Verify Running JobBubble App

on:
  workflow_dispatch:
  push:
    branches: [ feature/dark-theme-muse-verification ]
    paths:
      - '**/*.zip'
      - 'scripts/**'
      - '.github/workflows/verify-running-app.yml'

permissions:
  contents: read

jobs:
  verify-running-app:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Free runner storage
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"/CodeQL || true
          sudo apt-get clean || true
          docker system prune -af || true

      - name: Enable KVM acceleration
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Fetch expected live Muse jobs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,urllib.request,os,time
          url='https://jobbubble-backend-1.onrender.com/jobs?where=Everett%2C+WA&lat=47.9780&lon=-122.2021&radius=100&source=themuse'
          data=None
          last=None
          for attempt in range(3):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'JobBubble-Verification/9.4.48'})
                  with urllib.request.urlopen(req,timeout=90) as r:
                      data=json.load(r)
                  break
              except Exception as e:
                  last=e
                  print(f'Backend attempt {attempt+1} failed: {e}')
                  if attempt<2: time.sleep(8)
          if data is None: raise last
          titles=[]
          for j in data.get('jobs') or []:
              title=str(j.get('title') or '').strip()
              src=str(j.get('source') or '').lower()
              if title and ('muse' in src or not src): titles.append(title)
          titles=list(dict.fromkeys(titles))
          print('LIVE_MUSE_JOB_COUNT=',len(titles))
          print('LIVE_MUSE_TITLES=',titles[:20])
          if len(titles)<2: raise SystemExit('Backend did not provide at least two Muse jobs')
          open(os.environ['RUNNER_TEMP']+'/expected-muse-titles.txt','w',encoding='utf-8').write('\n'.join(titles))
          PY

      - name: Extract, patch and clean project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'JobBubble-*.zip' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)
          test -n "$ZIP_FILE"
          rm -rf "$RUNNER_TEMP/jb"; mkdir -p "$RUNNER_TEMP/jb"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/jb"
          GRADLEW=$(find "$RUNNER_TEMP/jb" -type f -name gradlew -print -quit)
          test -n "$GRADLEW"
          P=$(dirname "$GRADLEW")
          python3 scripts/v943_patch.py "$P"
          python3 scripts/v944_patch.py "$P"
          python3 scripts/v947_patch.py "$P"
          python3 scripts/v948_cleanup.py "$P"
          test "$(tr -d '\r\n' < "$P/VERSION.txt")" = '9.4.48'
          echo "project_dir=$P" >> "$GITHUB_OUTPUT"

      - name: Inject Maps key
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GOOGLE_MAPS_API_KEY:-}"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          from xml.sax.saxutils import escape
          root=Path(os.environ['PROJECT_DIR'])
          key=escape(os.environ['GOOGLE_MAPS_API_KEY'],{'"':'&quot;'})
          replaced=0
          for manifest in root.rglob('src/main/AndroidManifest.xml'):
              text=manifest.read_text(encoding='utf-8')
              if 'com.google.android.geo.API_KEY' not in text: continue
              pat=re.compile(r'(<meta-data\s+[^>]*android:name=["\']com\.google\.android\.geo\.API_KEY["\'][^>]*android:value=["\'])[^"\']*(["\'][^>]*/?>)',re.S)
              text,n=pat.subn(r'\1'+key+r'\2',text,count=1)
              if n:
                  manifest.write_text(text,encoding='utf-8')
                  replaced+=1
          assert replaced
          PY

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dorg.gradle.vfs.watch=false
        run: chmod +x gradlew && ./gradlew --no-daemon --max-workers=2 assembleDebug

      - name: Prepare UI verification script
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/verify.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail

          dump_ui() {
            local name="$1"
            adb shell uiautomator dump --compressed "/sdcard/$name.xml" >/dev/null || true
            adb pull "/sdcard/$name.xml" "$RUNNER_TEMP/$name.xml" >/dev/null || true
          }

          tap_node() {
            local mode="$1" needle="$2" file="$3"
            python3 - "$mode" "$needle" "$file" <<'PY'
          import html,re,subprocess,sys
          mode,needle,path=sys.argv[1:]
          text=open(path,encoding='utf-8').read()
          for node in re.findall(r'<node[^>]*>',text):
              bounds=re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"',node)
              if not bounds: continue
              if mode=='text':
                  value=re.search(r'text="([^"]*)"',node)
                  matched=value and needle.casefold() in html.unescape(value.group(1)).casefold()
              else:
                  value=re.search(r'resource-id="([^"]*)"',node)
                  matched=value and value.group(1).endswith('/'+needle)
              if matched:
                  x=(int(bounds[1])+int(bounds[3]))//2
                  y=(int(bounds[2])+int(bounds[4]))//2
                  subprocess.run(['adb','shell','input','tap',str(x),str(y)],check=True)
                  raise SystemExit(0)
          raise SystemExit(f'missing {mode}: {needle}')
          PY
          }

          tap_text() { tap_node text "$1" "$2"; }
          tap_resource() { tap_node resource "$1" "$2"; }

          dismiss_overlays() {
            for n in 1 2 3 4; do
              dump_ui "overlay-$n"
              f="$RUNNER_TEMP/overlay-$n.xml"
              if grep -q 'Got it' "$f" 2>/dev/null; then tap_text 'Got it' "$f" || true; sleep 1; continue; fi
              if grep -q "isn't responding" "$f" 2>/dev/null; then
                tap_text 'Wait' "$f" 2>/dev/null || tap_text 'Close app' "$f" 2>/dev/null || true
                sleep 1; continue
              fi
              break
            done
          }

          adb wait-for-device
          adb shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done'
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb emu geo fix -122.2021 47.9780 || true

          APK=$(find "${{ steps.project.outputs.project_dir }}" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)
          test -n "$APK"
          adb install -r -g "$APK"
          B=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n1)
          AAPT="$ANDROID_HOME/build-tools/$B/aapt"
          PKG=$("$AAPT" dump badging "$APK" | sed -n "s/package: name='\([^']*\)'.*/\1/p")
          ACT=$("$AAPT" dump badging "$APK" | sed -n "s/launchable-activity: name='\([^']*\)'.*/\1/p")
          adb shell am force-stop com.google.android.apps.nexuslauncher || true
          adb shell am force-stop "$PKG"
          adb logcat -c
          adb shell am start -W -n "$PKG/$ACT"
          sleep 3
          dismiss_overlays

          dump_ui initial
          adb exec-out screencap -p > "$RUNNER_TEMP/initial.png"
          if grep -qi 'Continue as Guest' "$RUNNER_TEMP/initial.xml"; then
            tap_text 'Continue as Guest' "$RUNNER_TEMP/initial.xml"
            sleep 5
          elif grep -qi 'Guest' "$RUNNER_TEMP/initial.xml"; then
            tap_text 'Guest' "$RUNNER_TEMP/initial.xml"
            sleep 5
          fi
          dismiss_overlays

          dump_ui main
          grep -q 'package="com.jobbubble.app"' "$RUNNER_TEMP/main.xml"

          # Source dialogs stage a choice until Apply is pressed.
          tap_resource sourceChip "$RUNNER_TEMP/main.xml"
          sleep 1
          dump_ui source-menu
          tap_text 'The Muse' "$RUNNER_TEMP/source-menu.xml"
          sleep 1
          dump_ui source-selected
          tap_text 'Apply' "$RUNNER_TEMP/source-selected.xml"
          sleep 3
          dismiss_overlays

          dump_ui after-source
          grep -q 'The Muse' "$RUNNER_TEMP/after-source.xml"

          tap_resource distanceValue "$RUNNER_TEMP/after-source.xml"
          sleep 1
          dump_ui distance-menu
          tap_text '100' "$RUNNER_TEMP/distance-menu.xml"
          sleep 1
          dump_ui distance-selected
          if grep -q 'text="Apply"' "$RUNNER_TEMP/distance-selected.xml"; then
            tap_text 'Apply' "$RUNNER_TEMP/distance-selected.xml"
          fi
          sleep 3
          dismiss_overlays

          dump_ui selected-filters
          grep -q 'The Muse' "$RUNNER_TEMP/selected-filters.xml"
          grep -q '100' "$RUNNER_TEMP/selected-filters.xml"

          sleep 20
          dismiss_overlays
          dump_ui loaded-map
          adb exec-out screencap -p > "$RUNNER_TEMP/loaded-map.png"

          tap_resource navList "$RUNNER_TEMP/loaded-map.xml"
          sleep 5
          dismiss_overlays
          dump_ui list
          adb exec-out screencap -p > "$RUNNER_TEMP/list.png"

          python3 - <<'PY'
          import html,os,re
          xml=open(os.environ['RUNNER_TEMP']+'/list.xml',encoding='utf-8').read()
          texts=[html.unescape(x) for x in re.findall(r'text="([^"]+)"',xml) if x.strip()]
          def norm(s): return ' '.join(s.casefold().split())
          visible='\n'.join(norm(x) for x in texts)
          expected=[x.strip() for x in open(os.environ['RUNNER_TEMP']+'/expected-muse-titles.txt',encoding='utf-8') if x.strip()]
          matches=[t for t in expected if norm(t) in visible]
          print('VISIBLE_LIST_TEXTS=',texts)
          print('VISIBLE_EXPECTED_MUSE_MATCHES=',matches)
          if len(set(matches)) < 2:
              raise SystemExit('FAIL: running app did not visibly display at least two distinct live Muse job titles')
          print('PASS: running app visibly displays multiple live Muse jobs')
          PY
          SH
          chmod +x "$RUNNER_TEMP/verify.sh"

      - name: Run accelerated Android emulator and verify live UI
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_4
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot -wipe-data
          script: bash "$RUNNER_TEMP/verify.sh"

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JobBubble-running-app-verification
          path: |
            ${{ runner.temp }}/initial.png
            ${{ runner.temp }}/loaded-map.png
            ${{ runner.temp }}/list.png
            ${{ runner.temp }}/*.xml
            ${{ runner.temp }}/expected-muse-titles.txt
          if-no-files-found: warn
