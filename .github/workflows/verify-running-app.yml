name: Verify Running JobBubble App

on:
  push:
    branches:
      - feature/dark-theme-muse-verification
      - feature/code-cleanup-v948
      - repair/verify-running-app
    paths:
      - '.github/workflows/verify-running-app.yml'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  verify-running-app:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Free runner storage
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"/CodeQL || true
          sudo apt-get clean || true
          docker system prune -af || true
          df -h

      - name: Enable KVM acceleration
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Extract and patch project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'JobBubble-*.zip' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)
          rm -rf "$RUNNER_TEMP/jb"
          mkdir -p "$RUNNER_TEMP/jb"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/jb"
          GRADLEW=$(find "$RUNNER_TEMP/jb" -type f -name gradlew -print -quit)
          P=$(dirname "$GRADLEW")
          python3 scripts/apply_current.py "$P"
          echo "project_dir=$P" >> "$GITHUB_OUTPUT"

      - name: Inject Maps key
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GOOGLE_MAPS_API_KEY:-}"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          from xml.sax.saxutils import escape
          p=Path(os.environ['PROJECT_DIR'])
          key=escape(os.environ['GOOGLE_MAPS_API_KEY'],{'"':'&quot;'})
          found=False
          for m in p.rglob('src/main/AndroidManifest.xml'):
              t=m.read_text()
              if 'com.google.android.geo.API_KEY' not in t:
                  continue
              pat=re.compile(r'(<meta-data\s+[^>]*android:name=["\']com\.google\.android\.geo\.API_KEY["\'][^>]*android:value=["\'])[^"\']*(["\'][^>]*/?>)',re.S)
              t,n=pat.subn(r'\1'+key+r'\2',t,count=1)
              if n:
                  m.write_text(t)
                  found=True
          if not found:
              raise SystemExit('Maps API key manifest entry was not found')
          PY

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dorg.gradle.vfs.watch=false
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 assembleDebug

      - name: Run accelerated Android emulator and verify live UI
        uses: ReactiveCircus/android-emulator-runner@v2
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_4
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot -wipe-data
          script: bash scripts/verify_running_app.sh

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JobBubble-running-app-verification
          path: |
            ${{ runner.temp }}/loaded-map.png
            ${{ runner.temp }}/list.png
            ${{ runner.temp }}/main.xml
            ${{ runner.temp }}/entry-*.xml
            ${{ runner.temp }}/source-*.xml
            ${{ runner.temp }}/after-source.xml
            ${{ runner.temp }}/distance-*.xml
            ${{ runner.temp }}/selected-filters.xml
            ${{ runner.temp }}/loaded-map.xml
            ${{ runner.temp }}/list*.xml
            ${{ runner.temp }}/expected-muse-titles.txt
            ${{ runner.temp }}/overlay-*.xml
          if-no-files-found: warn
