name: Verify Running JobBubble App

on:
  push:
    branches: [ feature/dark-theme-muse-verification ]
    paths:
      - '.github/workflows/verify-running-app.yml'

permissions:
  contents: read

jobs:
  verify-running-app:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Free runner storage
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"/CodeQL || true
          sudo apt-get clean || true
          docker system prune -af || true
          df -h
      - name: Enable KVM acceleration
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Fetch expected live Muse jobs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,urllib.request,os
          url='https://jobbubble-backend-1.onrender.com/jobs?location=Everett%2C+WA&radius=100&source=themuse'
          with urllib.request.urlopen(url, timeout=90) as r:
              data=json.load(r)
          jobs=data.get('jobs') or []
          titles=[]
          for j in jobs:
              title=str(j.get('title') or '').strip()
              src=str(j.get('source') or '').lower()
              if title and ('muse' in src or not src):
                  titles.append(title)
          titles=list(dict.fromkeys(titles))
          print('LIVE_MUSE_JOB_COUNT=',len(titles))
          print('LIVE_MUSE_TITLES=',titles[:20])
          if len(titles)<2:
              raise SystemExit('Backend did not provide at least two Muse jobs for Everett, WA / 100 mi')
          open(os.environ['RUNNER_TEMP']+'/expected-muse-titles.txt','w').write('\n'.join(titles))
          PY
      - name: Extract and patch project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'JobBubble-*.zip' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)
          rm -rf "$RUNNER_TEMP/jb"; mkdir -p "$RUNNER_TEMP/jb"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/jb"
          GRADLEW=$(find "$RUNNER_TEMP/jb" -type f -name gradlew -print -quit)
          P=$(dirname "$GRADLEW")
          python3 scripts/v943_patch.py "$P"
          python3 scripts/v944_patch.py "$P"
          python3 scripts/v947_patch.py "$P"
          echo "project_dir=$P" >> "$GITHUB_OUTPUT"
      - name: Inject Maps key
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GOOGLE_MAPS_API_KEY:-}"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          from xml.sax.saxutils import escape
          p=Path(os.environ['PROJECT_DIR']); key=escape(os.environ['GOOGLE_MAPS_API_KEY'],{'"':'&quot;'})
          for m in p.rglob('src/main/AndroidManifest.xml'):
              t=m.read_text()
              if 'com.google.android.geo.API_KEY' in t:
                  pat=re.compile(r'(<meta-data\s+[^>]*android:name=["\']com\.google\.android\.geo\.API_KEY["\'][^>]*android:value=["\'])[^"\']*(["\'][^>]*/?>)',re.S)
                  t,n=pat.subn(r'\1'+key+r'\2',t,count=1); assert n
                  m.write_text(t)
          PY
      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dorg.gradle.vfs.watch=false
        run: chmod +x gradlew && ./gradlew --no-daemon --max-workers=2 assembleDebug
      - name: Prepare UI verification script
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/verify.sh" <<'SH'
          #!/usr/bin/env bash
          set -euxo pipefail
          dump_ui() {
            local name="$1"
            adb shell uiautomator dump --compressed "/sdcard/$name.xml" || true
            adb pull "/sdcard/$name.xml" "$RUNNER_TEMP/$name.xml" || true
          }
          tap_id() {
            local id="$1" file="$2"
            python3 - "$id" "$file" <<'PY'
          import re,sys,subprocess
          rid,path=sys.argv[1:]; s=open(path).read()
          m=re.search(r'<node[^>]*resource-id="'+re.escape(rid)+r'"[^>]*bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"',s)
          if not m: raise SystemExit('missing resource-id '+rid)
          x=(int(m[1])+int(m[3]))//2; y=(int(m[2])+int(m[4]))//2
          subprocess.run(['adb','shell','input','tap',str(x),str(y)],check=True)
          PY
          }
          tap_text() {
            local text="$1" file="$2"
            python3 - "$text" "$file" <<'PY'
          import re,sys,subprocess,html
          needle,path=sys.argv[1:]; s=open(path).read()
          nodes=re.findall(r'<node[^>]*>',s)
          for node in nodes:
              mt=re.search(r'text="([^"]*)"',node); mb=re.search(r'bounds="\[(\d+),(\d+)\]\[(\d+),(\d+)\]"',node)
              if mt and mb and needle.lower() in html.unescape(mt.group(1)).lower():
                  x=(int(mb[1])+int(mb[3]))//2; y=(int(mb[2])+int(mb[4]))//2
                  subprocess.run(['adb','shell','input','tap',str(x),str(y)],check=True); raise SystemExit(0)
          raise SystemExit('missing text '+needle)
          PY
          }
          adb wait-for-device
          adb shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done'
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          # Everett, WA. Emulator console geo fix takes longitude then latitude.
          adb emu geo fix -122.2021 47.9780 || true
          APK=$(find "${{ steps.project.outputs.project_dir }}" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)
          adb install -r -g "$APK"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n1)
          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt"
          PKG=$("$AAPT" dump badging "$APK" | sed -n "s/package: name='\([^']*\)'.*/\1/p")
          ACT=$("$AAPT" dump badging "$APK" | sed -n "s/launchable-activity: name='\([^']*\)'.*/\1/p")
          adb logcat -c
          adb shell am force-stop "$PKG"
          adb shell am start -W -n "$PKG/$ACT"
          sleep 3
          dump_ui pre
          if grep -q 'Got it' "$RUNNER_TEMP/pre.xml" 2>/dev/null; then tap_text 'Got it' "$RUNNER_TEMP/pre.xml"; sleep 2; fi
          dump_ui initial
          adb exec-out screencap -p > "$RUNNER_TEMP/initial.png"
          if grep -q 'Continue as Guest' "$RUNNER_TEMP/initial.xml" 2>/dev/null; then
            tap_text 'Continue as Guest' "$RUNNER_TEMP/initial.xml"; sleep 6
          elif grep -q 'Guest' "$RUNNER_TEMP/initial.xml" 2>/dev/null; then
            tap_text 'Guest' "$RUNNER_TEMP/initial.xml"; sleep 6
          fi
          dump_ui main
          echo '=== MAIN BEFORE FILTERS ==='; cat "$RUNNER_TEMP/main.xml"

          # Select The Muse source using the actual running app UI.
          tap_id 'com.jobbubble.app:id/sourceChip' "$RUNNER_TEMP/main.xml"
          sleep 1; dump_ui source-menu; echo '=== SOURCE MENU ==='; cat "$RUNNER_TEMP/source-menu.xml"
          tap_text 'The Muse' "$RUNNER_TEMP/source-menu.xml"
          sleep 2; dump_ui after-source

          # Expand radius to 100 miles so multiple live Muse jobs qualify.
          tap_id 'com.jobbubble.app:id/distanceValue' "$RUNNER_TEMP/after-source.xml"
          sleep 1; dump_ui distance-menu; echo '=== DISTANCE MENU ==='; cat "$RUNNER_TEMP/distance-menu.xml"
          tap_text '100' "$RUNNER_TEMP/distance-menu.xml"
          sleep 2; dump_ui selected-filters
          echo '=== SELECTED FILTERS ==='; cat "$RUNNER_TEMP/selected-filters.xml"
          grep -q 'The Muse' "$RUNNER_TEMP/selected-filters.xml"
          grep -q '100' "$RUNNER_TEMP/selected-filters.xml"

          # Give the initial + refined Muse pipeline time to finish, then verify in List view.
          sleep 18
          dump_ui loaded-map
          adb exec-out screencap -p > "$RUNNER_TEMP/loaded-map.png"
          tap_id 'com.jobbubble.app:id/navList' "$RUNNER_TEMP/loaded-map.xml"
          sleep 5; dump_ui list
          adb exec-out screencap -p > "$RUNNER_TEMP/list.png"
          echo '=== LIST UI ==='; cat "$RUNNER_TEMP/list.xml"
          echo '=== APP LOGS / MUSE ==='
          adb logcat -d -v brief | grep -i -E 'jobbubble|muse|job|refin|http|error|exception' | tail -n 500 || true

          python3 - <<'PY'
          import re,html,os
          xml=open(os.environ['RUNNER_TEMP']+'/list.xml').read()
          texts=[html.unescape(x) for x in re.findall(r'text="([^"]+)"',xml) if x.strip()]
          print('VISIBLE_LIST_TEXTS=',texts)
          def norm(s): return ' '.join(s.casefold().split())
          visible='\n'.join(norm(x) for x in texts)
          expected=[x.strip() for x in open(os.environ['RUNNER_TEMP']+'/expected-muse-titles.txt') if x.strip()]
          matches=[t for t in expected if norm(t) in visible]
          print('EXPECTED_MUSE_TITLES=',expected[:20])
          print('VISIBLE_EXPECTED_MUSE_MATCHES=',matches)
          if len(set(matches)) < 2:
              raise SystemExit('FAIL: running JobBubble app did not visibly display at least two distinct live Muse job titles')
          print('PASS: running JobBubble app visibly displays multiple distinct live Muse jobs')
          PY
          SH
          chmod +x "$RUNNER_TEMP/verify.sh"
      - name: Run accelerated Android emulator and verify live UI
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_4
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot -wipe-data
          script: bash "$RUNNER_TEMP/verify.sh"
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JobBubble-running-app-verification
          path: |
            ${{ runner.temp }}/initial.png
            ${{ runner.temp }}/loaded-map.png
            ${{ runner.temp }}/list.png
            ${{ runner.temp }}/initial.xml
            ${{ runner.temp }}/main.xml
            ${{ runner.temp }}/source-menu.xml
            ${{ runner.temp }}/distance-menu.xml
            ${{ runner.temp }}/selected-filters.xml
            ${{ runner.temp }}/loaded-map.xml
            ${{ runner.temp }}/list.xml
            ${{ runner.temp }}/expected-muse-titles.txt
          if-no-files-found: warn
