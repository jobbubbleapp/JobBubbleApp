name: Inspect UI color and sign-in

on:
  push:
    branches:
      - fix/ui-color-google-signin-v981
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize current Android source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'JobBubble-*.zip' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)
          mkdir -p "$RUNNER_TEMP/jobbubble-project"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/jobbubble-project"
          GRADLEW=$(find "$RUNNER_TEMP/jobbubble-project" -type f -name gradlew -print -quit)
          P=$(dirname "$GRADLEW")
          python3 scripts/apply_current.py "$P"
          echo "P=$P" >> "$GITHUB_ENV"
      - name: Inspect exact styling targets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ['P'])
          main=p/'app/src/main/java/com/jobbubble/app/MainActivity.java'
          lines=main.read_text(encoding='utf-8').splitlines()
          for a,b in [(1406,1502),(2870,2940)]:
              print(f'\n=== MainActivity {a}-{b} ===')
              for n in range(a-1,min(b,len(lines))): print(f'{n+1:05d}: {lines[n]}')
          for rel in [
              'app/src/main/res/drawable/welcome_google_button.xml',
              'app/src/main/res/layout/activity_auth.xml',
              'app/src/main/res/layout/activity_welcome.xml',
          ]:
              f=p/rel
              print(f'\n=== {rel} ===')
              print(f.read_text(encoding='utf-8'))
          PY
