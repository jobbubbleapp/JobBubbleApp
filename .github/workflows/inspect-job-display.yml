name: Inspect Job Display Logic

on:
  push:
    branches: [ feature/dark-theme-muse-verification ]
    paths:
      - '.github/workflows/inspect-job-display.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Muse loading, filtering and display path
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'JobBubble-*.zip' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)
          rm -rf /tmp/jb && mkdir -p /tmp/jb
          unzip -q "$ZIP_FILE" -d /tmp/jb
          MAIN=$(find /tmp/jb -type f -path '*/app/src/main/java/com/jobbubble/app/MainActivity.java' -print -quit)
          ROOT=${MAIN%/app/src/main/java/com/jobbubble/app/MainActivity.java}
          python3 scripts/v943_patch.py "$ROOT"
          python3 scripts/v944_patch.py "$ROOT"
          python3 scripts/v947_patch.py "$ROOT"
          echo '=== Muse/source/refining references ==='
          grep -n -E -C 8 'refining|The Muse|themuse|sourceParam|normalizeSource' "$MAIN" || true
          echo '=== loadJobs references ==='
          grep -n -E -C 30 'void loadJobs|loadJobs\(' "$MAIN" || true
          echo '=== JSON response parsing ==='
          grep -n -E -C 25 'getJSONArray\("jobs"\)|optJSONArray\("jobs"\)|JSONArray.*jobs|JSONObject.*job' "$MAIN" || true
          echo '=== filtering/visible jobs ==='
          grep -n -E -C 20 'visibleJobs|boolean ok=d<=|preciseLocationsOnly|minPay' "$MAIN" || true
          echo '=== rendering/piles ==='
          grep -n -E -C 18 'buildPiles|renderJobs|showClusterSideList|jobIndexes' "$MAIN" || true
