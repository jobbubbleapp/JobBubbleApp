name: Build JobBubble APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**/*.zip'
      - 'scripts/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'JobBubble-*.zip' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)
          test -n "$ZIP_FILE"
          rm -rf "$RUNNER_TEMP/jobbubble-project"
          mkdir -p "$RUNNER_TEMP/jobbubble-project"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/jobbubble-project"
          GRADLEW=$(find "$RUNNER_TEMP/jobbubble-project" -type f -name gradlew -print -quit)
          test -n "$GRADLEW"
          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Apply JobBubble patches through V9.4.48
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${{ steps.project.outputs.project_dir }}"
          python3 scripts/v943_patch.py "$PROJECT"
          python3 scripts/v944_patch.py "$PROJECT"
          python3 scripts/v947_patch.py "$PROJECT"
          python3 scripts/v948_patch.py "$PROJECT"
          MAIN="$PROJECT/app/src/main/java/com/jobbubble/app/MainActivity.java"
          GRADLE="$PROJECT/app/build.gradle"
          grep -q 'MapColorScheme' "$MAIN"
          grep -q 'setMapColorScheme("dark".equals(mapTheme)?MapColorScheme.DARK:MapColorScheme.LIGHT)' "$MAIN"
          grep -q 'Dark map' "$MAIN"
          grep -q '"ATS","Greenhouse","Lever","Ashby"' "$MAIN"
          grep -q 'private void showBugReport()' "$MAIN"
          grep -q '/report-bug' "$MAIN"
          grep -q "versionName '9.4.48'" "$GRADLE"
          grep -q 'versionCode 82' "$GRADLE"

      - name: Inject Google Maps API key
        shell: bash
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${GOOGLE_MAPS_API_KEY:-}"
          export PROJECT="${{ steps.project.outputs.project_dir }}"
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          from xml.sax.saxutils import escape
          project = Path(os.environ['PROJECT'])
          key = escape(os.environ['GOOGLE_MAPS_API_KEY'], {'"': '&quot;'})
          manifests = list(project.rglob('src/main/AndroidManifest.xml'))
          if not manifests:
              raise SystemExit('No AndroidManifest.xml found')
          for manifest in manifests:
              text = manifest.read_text(encoding='utf-8')
              pattern = re.compile(r'(<meta-data\s+[^>]*android:name=["\']com\.google\.android\.geo\.API_KEY["\'][^>]*android:value=["\'])[^"\']*(["\'][^>]*/?>)', re.DOTALL)
              updated, count = pattern.subn(r'\1' + key + r'\2', text, count=1)
              if count:
                  manifest.write_text(updated, encoding='utf-8')
                  break
          else:
              raise SystemExit('Could not inject Google Maps API key')
          PY

      - name: Build unsigned release APK
        shell: bash
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleRelease --stacktrace

      - name: Align and sign release APK
        id: sign
        shell: bash
        env:
          KEYSTORE_PASSWORD: JobBubbleBuild2026
        run: |
          set -euo pipefail
          PROJECT="${{ steps.project.outputs.project_dir }}"
          BUILD_TOOLS=$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n1)
          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          UNSIGNED=$(find "$PROJECT" -type f -path '*/build/outputs/apk/release/*-unsigned.apk' -print -quit)
          test -n "$UNSIGNED"
          KEYSTORE="$RUNNER_TEMP/jobbubble-release.jks"
          ALIGNED="$RUNNER_TEMP/JobBubble-V9.4.48-release-aligned.apk"
          SIGNED="$RUNNER_TEMP/JobBubble-V9.4.48-release-signed.apk"
          keytool -genkeypair -v -keystore "$KEYSTORE" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" -alias jobbubble -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=JobBubble, OU=Android, O=JobBubble, L=Sacramento, ST=California, C=US"
          "$ZIPALIGN" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-key-alias jobbubble --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEYSTORE_PASSWORD" --out "$SIGNED" "$ALIGNED"
          "$APKSIGNER" verify --verbose --print-certs "$SIGNED"
          echo "signed=$SIGNED" >> "$GITHUB_OUTPUT"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: JobBubble-V9.4.48-release-signed
          path: ${{ steps.sign.outputs.signed }}
          if-no-files-found: error
          retention-days: 30
