name: Build JobBubble APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/dark-theme-muse-verification
      - feature/code-cleanup-v948
    paths:
      - '**/*.zip'
      - 'scripts/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate and extract Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'JobBubble-*.zip' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)
          test -n "$ZIP_FILE"
          rm -rf "$RUNNER_TEMP/jobbubble-project"
          mkdir -p "$RUNNER_TEMP/jobbubble-project"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/jobbubble-project"
          GRADLEW=$(find "$RUNNER_TEMP/jobbubble-project" -type f -name gradlew -print -quit)
          test -n "$GRADLEW"
          echo "project_dir=$(dirname "$GRADLEW")" >> "$GITHUB_OUTPUT"

      - name: Apply patches and verify compact controls
        shell: bash
        run: |
          set -euo pipefail
          P="${{ steps.project.outputs.project_dir }}"
          python3 scripts/apply_current.py "$P"
          MAIN="$P/app/src/main/java/com/jobbubble/app/MainActivity.java"
          LAYOUT="$P/app/src/main/res/layout/activity_main.xml"
          test "$(cat "$P/VERSION.txt" | tr -d '\r\n')" = '9.4.65'
          grep -Fq 'final int targetHeight=dp(30);' "$MAIN"
          grep -Fq 'final int parentRoom=dp(34);' "$MAIN"
          grep -Fq 'R.id.payValue' "$MAIN"
          python3 - "$LAYOUT" <<'PY'
          import re,sys
          from pathlib import Path
          x=Path(sys.argv[1]).read_text(encoding='utf-8')
          for view_id in ('locationButton','distanceValue','payValue','categoryChip','sourceChip'):
              m=re.search(r'<[^>]*android:id="@\+id/'+re.escape(view_id)+r'"[^>]*>',x,re.S)
              if not m:
                  raise SystemExit('missing '+view_id)
              tag=m.group(0)
              if 'android:layout_height="30dp"' not in tag:
                  raise SystemExit(view_id+' height mismatch')
              if 'android:paddingTop="0dp"' not in tag or 'android:paddingBottom="0dp"' not in tag:
                  raise SystemExit(view_id+' padding mismatch')
          print('Compact top UI verified')
          PY

      - name: Inject Maps key
        shell: bash
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${GOOGLE_MAPS_API_KEY:-}"
          export PROJECT_DIR="${{ steps.project.outputs.project_dir }}"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          from xml.sax.saxutils import escape
          project=Path(os.environ['PROJECT_DIR'])
          key=escape(os.environ['GOOGLE_MAPS_API_KEY'],{'"':'&quot;'})
          for manifest in project.rglob('src/main/AndroidManifest.xml'):
              text=manifest.read_text(encoding='utf-8')
              if 'com.google.android.geo.API_KEY' in text:
                  pat=re.compile(r'(<meta-data\s+[^>]*android:name=["\']com\.google\.android\.geo.API_KEY["\'][^>]*android:value=["\'])[^"\']*(["\'][^>]*/?>)',re.DOTALL)
                  text,n=pat.subn(r'\1'+key+r'\2',text,count=1)
                  if n:
                      manifest.write_text(text,encoding='utf-8')
          PY

      - name: Build installable APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: chmod +x ./gradlew && ./gradlew --no-daemon clean assembleDebug --stacktrace

      - name: Collect APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          A=$(find "${{ steps.project.outputs.project_dir }}" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)
          test -n "$A"
          mkdir -p "$RUNNER_TEMP/apks"
          cp "$A" "$RUNNER_TEMP/apks/JobBubble-V9.4.65.apk"
          echo "path=$RUNNER_TEMP/apks/JobBubble-V9.4.65.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: JobBubble-V9.4.65
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
