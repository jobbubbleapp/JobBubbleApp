name: Build JobBubble APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**/*.zip'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate newest JobBubble project ZIP
        id: project_zip
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'JobBubble-*.zip' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)
          if [ -z "${ZIP_FILE:-}" ]; then
            echo 'No JobBubble project ZIP was found in the repository root.' >&2
            exit 1
          fi
          echo "Using project archive: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/jobbubble-project"
          mkdir -p "$RUNNER_TEMP/jobbubble-project"
          unzip -q "${{ steps.project_zip.outputs.zip_file }}" -d "$RUNNER_TEMP/jobbubble-project"

      - name: Locate Gradle wrapper
        id: gradle_project
        shell: bash
        run: |
          set -euo pipefail
          GRADLEW=$(find "$RUNNER_TEMP/jobbubble-project" -type f -name gradlew -print -quit)
          if [ -z "${GRADLEW:-}" ]; then
            echo 'gradlew was not found inside the project ZIP.' >&2
            echo 'Archive contents:' >&2
            find "$RUNNER_TEMP/jobbubble-project" -maxdepth 3 -type f | head -200 >&2
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "Gradle project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Inject Google Maps API key
        shell: bash
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_MAPS_API_KEY:-}" ]; then
            echo 'Missing required GitHub Actions secret: GOOGLE_MAPS_API_KEY' >&2
            exit 1
          fi

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          from xml.sax.saxutils import escape

          project = Path(os.environ['RUNNER_TEMP']) / 'jobbubble-project'
          key = escape(os.environ['GOOGLE_MAPS_API_KEY'], {'"': '&quot;'})
          manifests = list(project.rglob('src/main/AndroidManifest.xml'))
          if not manifests:
              raise SystemExit('No src/main/AndroidManifest.xml found in extracted project')

          updated = 0
          for manifest in manifests:
              text = manifest.read_text(encoding='utf-8')
              if 'com.google.android.geo.API_KEY' in text:
                  pattern = re.compile(r'(<meta-data\s+[^>]*android:name=["\']com\.google\.android\.geo\.API_KEY["\'][^>]*android:value=["\'])[^"\']*(["\'][^>]*/?>)', re.DOTALL)
                  new_text, count = pattern.subn(r'\1' + key + r'\2', text, count=1)
                  if count == 0:
                      raise SystemExit(f'Found Maps API metadata but could not replace value in {manifest}')
              else:
                  marker = '</application>'
                  if marker not in text:
                      continue
                  metadata = f'        <meta-data android:name="com.google.android.geo.API_KEY" android:value="{key}" />\n'
                  new_text = text.replace(marker, metadata + '    ' + marker, 1)
              if new_text != text:
                  manifest.write_text(new_text, encoding='utf-8')
                  updated += 1

          if updated == 0:
              raise SystemExit('Could not inject Google Maps API key into any main manifest')
          print(f'Google Maps API key injected into {updated} manifest(s).')
          PY

      - name: Build debug APK
        shell: bash
        working-directory: ${{ steps.gradle_project.outputs.project_dir }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleDebug --stacktrace

      - name: Collect APK files
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apks"
          find "${{ steps.gradle_project.outputs.project_dir }}" -type f -path '*/build/outputs/apk/*/*.apk' -exec cp {} "$RUNNER_TEMP/apks/" \;
          echo 'Built APKs:'
          ls -lh "$RUNNER_TEMP/apks"

      - name: Upload JobBubble APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JobBubble-debug-apk
          path: ${{ runner.temp }}/apks/*.apk
          if-no-files-found: error
          retention-days: 30
