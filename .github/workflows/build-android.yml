name: Build JobBubble APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/dark-theme-muse-verification
      - feature/code-cleanup-v948
    paths:
      - '**/*.zip'
      - 'scripts/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate and extract Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'JobBubble-*.zip' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)
          test -n "$ZIP_FILE"
          rm -rf "$RUNNER_TEMP/jobbubble-project"; mkdir -p "$RUNNER_TEMP/jobbubble-project"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/jobbubble-project"
          GRADLEW=$(find "$RUNNER_TEMP/jobbubble-project" -type f -name gradlew -print -quit)
          test -n "$GRADLEW"
          echo "project_dir=$(dirname "$GRADLEW")" >> "$GITHUB_OUTPUT"
      - name: Apply current patches and verify cleanup
        shell: bash
        run: |
          set -euo pipefail
          P="${{ steps.project.outputs.project_dir }}"
          python3 scripts/apply_current.py "$P"
          MAIN="$P/app/src/main/java/com/jobbubble/app/MainActivity.java"
          STYLE="$P/app/src/main/res/raw/google_map_dark_style.json"
          grep -q 'The Muse' "$MAIN"
          ! grep -qi 'CareerOneStop' "$MAIN"
          ! grep -qi 'NLx' "$MAIN"
          grep -q 'if("dark".equals(mapTheme)) googleMap.setMapStyle(MapStyleOptions.loadRawResourceStyle(this,R.raw.google_map_dark_style))' "$MAIN"
          grep -q 'else googleMap.setMapStyle(new MapStyleOptions("\[\]"))' "$MAIN"
          grep -q 'if(pile.jobIndexes.size()>5)' "$MAIN"
          grep -q '(j.pay<=0||j.pay>=minPay)' "$MAIN"
          grep -q 'sourcesMatch(j.source,source)' "$MAIN"
          grep -q '#071C2C' "$MAIN"
          python3 -m json.tool "$STYLE" >/dev/null
          test "$(cat "$P/VERSION.txt" | tr -d '\r\n')" = '9.4.50'
          MAIN="$MAIN" python3 - <<'PY'
          import os,re
          from pathlib import Path
          s=Path(os.environ['MAIN']).read_text(encoding='utf-8')
          removed=[
            'addForeignCountryLabel','bboxIntersects','bestAddressText','chooseCompanyLocation',
            'correctJobCoordinates','followJob','isGenericCompanyName','ovalStrokeBg',
            'renderExpandedPile','shortCompanyName','tileYToLatitude','violetGlassBg',
            'chooseBestListingLocation','companyTokensMatch','looksLikeStreetAddress'
          ]
          for name in removed:
              decl=re.compile(r'(?m)^[ \t]*(?:public|private|protected)?[ \t]*(?:static[ \t]+)?(?:final[ \t]+)?(?:[\w<>\[\],.?]+[ \t]+)+'+re.escape(name)+r'[ \t]*\(')
              if decl.search(s):
                  raise SystemExit(f'dead method still present: {name}')
          if 'CareerOneStop' in s or 'NLx' in s:
              raise SystemExit('CareerOneStop/NLx still present')
          print('Dead-code and CareerOneStop removal verification passed.')
          PY
      - name: Probe patched runtime flow
        shell: bash
        run: python3 scripts/probe_runtime_flow.py "${{ steps.project.outputs.project_dir }}"
      - name: Inject Google Maps API key
        shell: bash
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${GOOGLE_MAPS_API_KEY:-}"
          export PROJECT_DIR="${{ steps.project.outputs.project_dir }}"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          from xml.sax.saxutils import escape
          project=Path(os.environ['PROJECT_DIR']); key=escape(os.environ['GOOGLE_MAPS_API_KEY'],{'"':'&quot;'})
          manifests=list(project.rglob('src/main/AndroidManifest.xml')); assert manifests
          for manifest in manifests:
              text=manifest.read_text(encoding='utf-8')
              if 'com.google.android.geo.API_KEY' in text:
                  pat=re.compile(r'(<meta-data\s+[^>]*android:name=["\']com\.google\.android\.geo\.API_KEY["\'][^>]*android:value=["\'])[^"\']*(["\'][^>]*/?>)',re.DOTALL)
                  text,n=pat.subn(r'\1'+key+r'\2',text,count=1); assert n
                  manifest.write_text(text,encoding='utf-8')
          PY
      - name: Build release APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: chmod +x ./gradlew && ./gradlew --no-daemon clean assembleRelease --stacktrace
      - name: Sign and verify APK
        id: sign
        shell: bash
        env:
          KEYSTORE_PASSWORD: JobBubbleBuild2026
        run: |
          set -euo pipefail
          B=$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n1)
          U=$(find "${{ steps.project.outputs.project_dir }}" -type f -path '*/build/outputs/apk/release/*-unsigned.apk' -print -quit)
          test -n "$U"
          K="$RUNNER_TEMP/jobbubble-release.jks"; A="$RUNNER_TEMP/aligned.apk"; S="$RUNNER_TEMP/JobBubble-V9.4.50-release-signed.apk"
          keytool -genkeypair -keystore "$K" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" -alias jobbubble -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=JobBubble, OU=Android, O=JobBubble, C=US"
          "$ANDROID_HOME/build-tools/$B/zipalign" -f -p 4 "$U" "$A"
          "$ANDROID_HOME/build-tools/$B/apksigner" sign --ks "$K" --ks-key-alias jobbubble --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEYSTORE_PASSWORD" --out "$S" "$A"
          "$ANDROID_HOME/build-tools/$B/apksigner" verify --verbose "$S"
          mkdir -p "$RUNNER_TEMP/apks"; cp "$S" "$RUNNER_TEMP/apks/JobBubble-V9.4.50-release-signed.apk"
          echo "apk=$RUNNER_TEMP/apks/JobBubble-V9.4.50-release-signed.apk" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: JobBubble-V9.4.50-release-signed
          path: ${{ steps.sign.outputs.apk }}
          if-no-files-found: error
          retention-days: 30
