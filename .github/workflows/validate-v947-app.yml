name: Validate JobBubble V9.4.47 app changes

on:
  push:
    branches:
      - feature/help-bug-report
    paths:
      - 'scripts/v947_patch.py'
      - '.github/workflows/validate-v947-app.yml'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract current project and apply all patches
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'JobBubble-*.zip' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)
          test -n "$ZIP_FILE"
          rm -rf "$RUNNER_TEMP/jobbubble-v947"
          mkdir -p "$RUNNER_TEMP/jobbubble-v947"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/jobbubble-v947"
          GRADLEW=$(find "$RUNNER_TEMP/jobbubble-v947" -type f -name gradlew -print -quit)
          test -n "$GRADLEW"
          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          python3 scripts/v943_patch.py "$PROJECT_DIR"
          python3 scripts/v944_patch.py "$PROJECT_DIR"
          python3 scripts/v947_patch.py "$PROJECT_DIR"
      - name: Validate required V9.4.47 UI and source wiring
        shell: bash
        run: |
          set -euo pipefail
          MAIN="${{ steps.project.outputs.project_dir }}/app/src/main/java/com/jobbubble/app/MainActivity.java"
          GRADLE="${{ steps.project.outputs.project_dir }}/app/build.gradle"
          grep -q '"ATS","Greenhouse","Lever","Ashby"' "$MAIN"
          grep -q 'jobMatchesSelectedSource(Job j)' "$MAIN"
          grep -q 'return "greenhouse"' "$MAIN"
          grep -q 'return "lever"' "$MAIN"
          grep -q 'return "ashby"' "$MAIN"
          grep -q 'private void showBugReport()' "$MAIN"
          grep -q 'private void submitBugReport' "$MAIN"
          grep -q '/report-bug' "$MAIN"
          grep -q 'Report a bug' "$MAIN"
          grep -q 'App information' "$MAIN"
          grep -q 'Privacy' "$MAIN"
          ! grep -q 'No jobs showing' "$MAIN"
          ! grep -q 'Job location looks approximate' "$MAIN"
          grep -q "versionName '9.4.47'" "$GRADLE"
          grep -q 'versionCode 81' "$GRADLE"
      - name: Compile Android debug APK
        shell: bash
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleDebug --stacktrace
