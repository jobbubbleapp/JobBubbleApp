name: Validate JobBubble Android

on:
  push:
    branches:
      - main
      - fix/dark-map-v948
    paths:
      - 'scripts/**'
      - '**/*.zip'
      - '.github/workflows/validate-v947-app.yml'
      - '.github/workflows/build-android.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - '**/*.zip'
      - '.github/workflows/validate-v947-app.yml'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract current project and apply all patches
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'JobBubble-*.zip' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)
          test -n "$ZIP_FILE"
          rm -rf "$RUNNER_TEMP/jobbubble-v948"
          mkdir -p "$RUNNER_TEMP/jobbubble-v948"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/jobbubble-v948"
          GRADLEW=$(find "$RUNNER_TEMP/jobbubble-v948" -type f -name gradlew -print -quit)
          test -n "$GRADLEW"
          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          python3 scripts/v943_patch.py "$PROJECT_DIR"
          python3 scripts/v944_patch.py "$PROJECT_DIR"
          python3 scripts/v947_patch.py "$PROJECT_DIR"
          python3 scripts/v948_patch.py "$PROJECT_DIR"

      - name: Validate V9.4.48 app wiring
        shell: bash
        run: |
          set -euo pipefail
          MAIN="${{ steps.project.outputs.project_dir }}/app/src/main/java/com/jobbubble/app/MainActivity.java"
          GRADLE="${{ steps.project.outputs.project_dir }}/app/build.gradle"
          grep -q 'import com.google.android.gms.maps.model.MapColorScheme;' "$MAIN"
          grep -q 'googleMap.setMapStyle(null)' "$MAIN"
          grep -q 'googleMap.setMapColorScheme("dark".equals(mapTheme)?MapColorScheme.DARK:MapColorScheme.LIGHT)' "$MAIN"
          grep -q 'Dark map' "$MAIN"
          grep -q 'Light map' "$MAIN"
          grep -q '"ATS","Greenhouse","Lever","Ashby"' "$MAIN"
          grep -q 'jobMatchesSelectedSource(Job j)' "$MAIN"
          grep -q 'private void showBugReport()' "$MAIN"
          grep -q '/report-bug' "$MAIN"
          ! grep -q 'No jobs showing' "$MAIN"
          grep -q "versionName '9.4.48'" "$GRADLE"
          grep -q 'versionCode 82' "$GRADLE"

      - name: Audit dead private methods
        shell: bash
        run: |
          python3 - "${{ steps.project.outputs.project_dir }}/app/src/main/java/com/jobbubble/app/MainActivity.java" <<'PY'
          import re, sys
          from pathlib import Path
          text = Path(sys.argv[1]).read_text(encoding='utf-8')
          pattern = re.compile(r'(?m)^\s*private\s+(?:static\s+)?(?:final\s+)?[\w<>\[\].?, ]+\s+(\w+)\s*\([^;{]*\)\s*\{')
          dead = [name for name in sorted(set(pattern.findall(text))) if len(re.findall(r'\b' + re.escape(name) + r'\b', text)) == 1]
          if dead:
              raise SystemExit('Uncalled private methods found: ' + ', '.join(dead))
          print('Dead private-method audit: clean')
          PY

      - name: Compile Android debug APK
        shell: bash
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleDebug --stacktrace
